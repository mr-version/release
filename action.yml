name: 'Complete Version Release'
description: 'Complete release workflow for monorepo projects using Mister.Version - calculates versions, creates tags, and generates reports'
author: 'Mister.Version Team'

branding:
  icon: 'package'
  color: 'green'

inputs:
  # Repository settings
  repository-path:
    description: 'Path to the Git repository root'
    required: false
    default: '.'
  projects:
    description: 'Glob patterns or project file paths to process, separated by commas and/or newlines (relative to repository-path)'
    required: false
    default: '**/*.csproj'
  
  # Version calculation
  prerelease-type:
    description: 'Type of prerelease (alpha, beta, rc, none)'
    required: false
    default: 'none'
  tag-prefix:
    description: 'Prefix for version tags'
    required: false
    default: 'v'
  force-version:
    description: 'Force a specific version for all projects'
    required: false
  config-file:
    description: 'Path to mr-version.yml configuration file (auto-detected if not specified)'
    required: false
  allow-shallow:
    description: 'Calculate versions even if the repository is a shallow clone (by default a shallow clone fails; use actions/checkout with fetch-depth: 0)'
    required: false
    default: 'false'
  
  # Tag creation
  create-tags:
    description: 'Create git tags for the calculated versions'
    required: false
    default: 'true'
  create-global-tags:
    description: 'Create global tags for major releases'
    required: false
    default: 'false'
  global-tag-strategy:
    description: 'Strategy for global tags (major-only, all, none)'
    required: false
    default: 'major-only'
  tag-message-template:
    description: 'Template for tag messages (use {version}, {project}, {type} placeholders)'
    required: false
    default: 'Release {type} {version}'
  sign-tags:
    description: 'Sign tags with GPG (requires git config user.signingkey)'
    required: false
    default: 'false'
  push-tags:
    description: 'Push the created tags to origin (requires permissions: contents: write). Without pushing, the tags are lost with the runner.'
    required: false
    default: 'true'
  
  # Report generation
  generate-report:
    description: 'Generate a version report'
    required: false
    default: 'true'
  report-format:
    description: 'Report output format (text, json, csv, markdown)'
    required: false
    default: 'markdown'
  report-file:
    description: 'File path to save the report'
    required: false
  post-report-to-pr:
    description: 'Post the report as a PR comment (requires pull_request event)'
    required: false
    default: 'false'
  
  # Filtering options
  include-test-projects:
    description: 'Include test projects in processing'
    required: false
    default: 'false'
  include-non-packable:
    description: 'Include non-packable projects in processing'
    required: false
    default: 'false'
  only-changed:
    description: 'Only process projects with version changes'
    required: false
    default: 'true'
  
  # Behavior options
  dry-run:
    description: 'Show what would be done without making changes'
    required: false
    default: 'false'
  fail-on-no-changes:
    description: 'Fail if no version changes are detected'
    required: false
    default: 'false'
  fail-on-existing-tags:
    description: 'Fail if a tag already exists'
    required: false
    default: 'false'
  
  # GitHub integration
  token:
    description: 'GitHub token for PR comments and API access'
    required: false
    default: ${{ github.token }}

outputs:
  # Version calculation outputs
  projects:
    description: 'JSON array of all analyzed projects with their versions'
    value: ${{ steps.calculate.outputs.projects }}
  changed-projects:
    description: 'JSON array of projects with version changes'
    value: ${{ steps.calculate.outputs.changed-projects }}
  has-changes:
    description: 'Whether any version changes were detected'
    value: ${{ steps.calculate.outputs.has-changes }}
  projects-count:
    description: 'Number of analyzed projects'
    value: ${{ steps.calculate.outputs.projects-count }}
  changed-count:
    description: 'Number of projects with version changes'
    value: ${{ steps.calculate.outputs.changed-count }}

  # Validation outputs
  has-validation-errors:
    description: 'Whether any projects have validation errors'
    value: ${{ steps.calculate.outputs.has-validation-errors }}
  has-validation-warnings:
    description: 'Whether any projects have validation warnings'
    value: ${{ steps.calculate.outputs.has-validation-warnings }}
  validation-errors-count:
    description: 'Number of projects with validation errors'
    value: ${{ steps.calculate.outputs.validation-errors-count }}
  validation-warnings-count:
    description: 'Number of projects with validation warnings'
    value: ${{ steps.calculate.outputs.validation-warnings-count }}

  # Tagging outputs
  tags-created:
    description: 'JSON array of tags that were created'
    value: ${{ steps.tag.outputs.tags-created }}
  tags-count:
    description: 'Total number of tags created'
    value: ${{ steps.tag.outputs.tags-count }}
  tags-pushed:
    description: 'JSON array of the tag names pushed to origin'
    value: ${{ steps.tag.outputs.tags-pushed }}

  # Report outputs
  report-content:
    description: 'The generated report content'
    value: ${{ steps.report.outputs.report-content }}
  report-file:
    description: 'Path to the generated report file'
    value: ${{ steps.report.outputs.report-file }}

runs:
  using: 'composite'
  steps:
    # TODO(pinning): the sub-actions are referenced by @main because their v1 tags still point at the
    # initial check-in commits, which lack the inputs/outputs used below (projects-json, push-tags,
    # projects-count, ...). Once calculate, tag, report and setup have moved v1 to a release commit,
    # switch every reference below to @v1 together and move release's own v1 to that commit.
    - name: Setup Mister.Version
      uses: mr-version/setup@main
      with:
        version: 'latest'

    - name: Calculate Versions
      id: calculate
      uses: mr-version/calculate@main
      with:
        projects: ${{ inputs.projects }}
        repository-path: ${{ inputs.repository-path }}
        prerelease-type: ${{ inputs.prerelease-type }}
        tag-prefix: ${{ inputs.tag-prefix }}
        force-version: ${{ inputs.force-version }}
        config-file: ${{ inputs.config-file }}
        include-test-projects: ${{ inputs.include-test-projects }}
        allow-shallow: ${{ inputs.allow-shallow }}
        output-format: 'json'
        fail-on-no-changes: ${{ inputs.fail-on-no-changes }}

    # Tags exactly the versions calculated above (same prerelease type, config and forced version)
    - name: Create Tags
      id: tag
      if: ${{ inputs.create-tags == 'true' && steps.calculate.outputs.has-changes == 'true' }}
      uses: mr-version/tag@main
      with:
        projects-json: ${{ steps.calculate.outputs.projects }}
        repository-path: ${{ inputs.repository-path }}
        tag-prefix: ${{ inputs.tag-prefix }}
        create-global-tags: ${{ inputs.create-global-tags }}
        global-tag-strategy: ${{ inputs.global-tag-strategy }}
        tag-message-template: ${{ inputs.tag-message-template }}
        dry-run: ${{ inputs.dry-run }}
        fail-on-existing: ${{ inputs.fail-on-existing-tags }}
        include-test-projects: ${{ inputs.include-test-projects }}
        include-non-packable: ${{ inputs.include-non-packable }}
        only-changed: ${{ inputs.only-changed }}
        sign-tags: ${{ inputs.sign-tags }}
        push-tags: ${{ inputs.push-tags }}

    - name: Generate Report
      id: report
      if: ${{ inputs.generate-report == 'true' }}
      uses: mr-version/report@main
      with:
        repository-path: ${{ inputs.repository-path }}
        output-format: ${{ inputs.report-format }}
        output-file: ${{ inputs.report-file }}
        tag-prefix: ${{ inputs.tag-prefix }}
        include-commits: 'true'
        include-dependencies: 'true'
        include-test-projects: ${{ inputs.include-test-projects }}
        include-non-packable: ${{ inputs.include-non-packable }}
        post-to-pr: ${{ inputs.post-report-to-pr }}
        update-existing-comment: 'true'
        comment-header: '## 🚀 Release Report'
        token: ${{ inputs.token }}

    - name: Summary
      if: ${{ !cancelled() }}
      shell: bash
      env:
        PROJECTS_COUNT: ${{ steps.calculate.outputs.projects-count }}
        CHANGED_COUNT: ${{ steps.calculate.outputs.changed-count }}
        TAGS_COUNT: ${{ steps.tag.outputs.tags-count }}
        TAGS_PUSHED: ${{ steps.tag.outputs.tags-pushed }}
        GENERATE_REPORT: ${{ inputs.generate-report }}
        HAS_VALIDATION_ERRORS: ${{ steps.calculate.outputs.has-validation-errors }}
        VALIDATION_ERRORS_COUNT: ${{ steps.calculate.outputs.validation-errors-count }}
        HAS_VALIDATION_WARNINGS: ${{ steps.calculate.outputs.has-validation-warnings }}
        VALIDATION_WARNINGS_COUNT: ${{ steps.calculate.outputs.validation-warnings-count }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        {
          echo "## 🚀 Release Summary"
          echo ""
          echo "- **Projects analyzed**: ${PROJECTS_COUNT:-0}"
          echo "- **Projects with changes**: ${CHANGED_COUNT:-0}"
          echo "- **Tags created**: ${TAGS_COUNT:-0}"
          if [[ -n "$TAGS_PUSHED" && "$TAGS_PUSHED" != "[]" ]]; then
            echo "- **Tags pushed**: ${TAGS_PUSHED}"
          fi
          echo "- **Report generated**: ${GENERATE_REPORT}"
          if [[ "$HAS_VALIDATION_ERRORS" == "true" ]]; then
            echo "- **Validation errors**: ❌ ${VALIDATION_ERRORS_COUNT} project(s)"
          fi
          if [[ "$HAS_VALIDATION_WARNINGS" == "true" ]]; then
            echo "- **Validation warnings**: ⚠️ ${VALIDATION_WARNINGS_COUNT} project(s)"
          fi
          echo "- **Dry run mode**: ${DRY_RUN}"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo ""
            echo "> 🧪 **Dry Run Mode** - No actual changes were made"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
